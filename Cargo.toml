[package]
name = "udstunnel"
version = "0.1.0"
edition = "2021"
authors = ["Adolfo Gómez <Dkmaster@dkmon.com>"]

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
tokio-rustls = "0.26.4"
bytes = "1.11.1"
rustls = { version = "0.23.37", features = ["tls12"] }
rustls-native-certs = "0.8.3"
env_logger = "0.11.9"
log = "0.4.29"
async-trait = "0.1.89"
config = "0.15.22"
clap = { version = "4.6.0", features = ["derive"] }
uuid = { version = "1.22.0", features = ["v4"] }
reqwest = { version = "0.13.2", features = ["rustls", "json"] }
serde = { version = "1.0.225", features = ["derive"] }
sha2 = "0.10.9"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4.5"
mockall = "0.14"
mockito = "1.7"